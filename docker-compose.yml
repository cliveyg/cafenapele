services:
  db:
    image: mysql:8.0
    container_name: tastyigniter-db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --innodb-buffer-pool-size=128M
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE:-tastyigniter}
      MYSQL_USER: ${DB_USERNAME:-tastyigniter}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  app:
    build: .
    container_name: tastyigniter-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: ${APP_NAME:-TastyIgniter}
      APP_URL: ${APP_URL:-http://localhost:8080}
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-tastyigniter}
      DB_USERNAME: ${DB_USERNAME:-tastyigniter}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - app_public:/var/www/html/public
      - app_storage:/var/www/html/storage
      - app_extensions:/var/www/html/extensions
      - app_themes:/var/www/html/themes

  nginx:
    image: nginx:1.27-alpine
    container_name: tastyigniter-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - app_public:/var/www/html/public:ro
      - app_storage:/var/www/html/storage:ro
      - app_extensions:/var/www/html/extensions:ro
      - app_themes:/var/www/html/themes:ro

volumes:
  db_data:
  app_public:
  app_storage:
  app_extensions:
  app_themes:
